version: '3.8'

services:
  inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7861:7861"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./api_app.py:/app/api_app.py
      - ./saves:/app/LLaMA-Factory/saves
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - OMP_NUM_THREADS=4
      - API_KEY=super-secreto-2025
    mem_limit: 12g
    command: python /app/api_app.py

volumes:
  huggingface_cache:
